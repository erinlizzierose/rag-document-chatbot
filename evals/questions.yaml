# --- Must refuse: not covered by the corpus ---
#
# Half of what this app does is declining. Retrieval always returns six chunks, because
# similarity search has no concept of "no match", so these questions get just as much context
# as the real ones. Only the prompt stops the model answering from it.

- id: refuse-capital-of-france
  question: What is the capital of France?
  should_refuse: true

- id: refuse-django-deploy
  question: How do I deploy a Django application to Heroku?
  should_refuse: true

- id: refuse-model-pricing
  question: How much does OpenAI charge per token for gpt-4o-mini?
  should_refuse: true
  # Adjacent to the corpus without being in it. The docs mention model names constantly, so
  # this is the refusal most likely to fail.

- id: refuse-langchain-roadmap
  question: What features are planned for LangChain v2?
  should_refuse: true
  # Plausible, specific, and entirely absent. A confident answer here is a hallucination.

- id: refuse-project-internals
  question: How do I set the page title in a Streamlit app?
  should_refuse: true
  # About the app itself rather than its corpus. The first version of this asked what chunk
  # size "this chatbot" uses, which the model reasonably read as the chatbot in the docs and
  # answered from a LangChain code sample. That was an ambiguous question, not a bad refusal.
  # Streamlit appears nowhere in the LangChain documentation, so this version has one reading.

# --- Must refuse: near misses ---
#
# The refusals above are off topic, and any model declines those easily. These ask about
# something the documents discuss at length but never answer, which is where a model fills the
# gap from its own training or from a code sample written for something else. That is what
# happened to chat-model-return-type before the chunk size was fixed: the wrong chunks came back
# and the model answered from an unrelated snippet instead of declining.

- id: refuse-near-miss-encrypt-checkpoints
  question: How do I encrypt the checkpoints that PostgresSaver stores?
  should_refuse: true
  # PostgresSaver setup appears throughout persistence.md and add-memory.md. Nothing in data/
  # mentions encryption.

- id: refuse-near-miss-redis-version
  question: Which Redis server version does RedisSaver require?
  should_refuse: true
  # add-memory.md shows RedisSaver setup and a connection string, never a server version.

- id: refuse-near-miss-embeddings-return-type
  question: What changed about the return type of embed_query in v1?
  should_refuse: true
  # Built to mirror chat-model-return-type. The migration guide covers the chat model return
  # type and lists embeddings modules, but never mentions embed_query.
