# Evaluation set for the document chatbot.
#
# Each entry is one question plus the loosest check that would still catch a real regression.
# The point is not to grade prose. It is to notice when the app stops finding the right
# documents, or stops refusing questions it cannot answer.
#
# Fields:
#   id            short slug, so a failure has a name you can talk about
#   question      asked exactly as written, with no conversation history
#   must_mention  terms that all have to appear in the answer, matched case-insensitively at the
#                 start of a word, so "embed" matches "embedding" but "lose" does not match
#                 "close". An entry can be a list of alternatives where any one counts, for
#                 advice the documents phrase more than one way
#   should_refuse true if the corpus genuinely does not cover this and the app must say so
#   expect_source a file the answer should have retrieved from, or a list of files where any
#                 one counts. Checked separately from the text so you can see retrieval
#                 drift even while answers still pass
#
# Keep must_mention short. Two or three load-bearing terms catch regressions; a long list just
# fails whenever the model rephrases something, and a suite that cries wolf gets ignored.
#
# The corpus is a 2026-08-04 snapshot of the LangChain docs. These expectations describe what
# those documents say, not what is true of LangChain today.

# --- Answerable: short-term memory and checkpointers ---

- id: add-checkpointer
  question: How do I add short-term memory to a LangGraph agent?
  must_mention: ["checkpointer"]
  should_refuse: false
  expect_source: data/langchain-short-term-memory.md

- id: checkpointer-vs-store
  question: What is the difference between a checkpointer and a store?
  must_mention: ["thread"]
  should_refuse: false
  expect_source: data/langchain-persistence.md

- id: memorysaver-restarts
  question: Why does MemorySaver lose my conversations when the process restarts, and what should I use instead?
  must_mention: ["PostgresSaver"]
  should_refuse: false
  expect_source: data/langchain-persistence.md

- id: thread-id-too-long
  question: I am getting a database error that my thread_id is too long with PostgresSaver. What is the fix?
  must_mention: ["255"]
  should_refuse: false
  expect_source: data/langchain-persistence.md

- id: checkpoints-unbounded
  question: My checkpoints keep growing over long conversations. What does the documentation suggest?
  # The doc's fix says "prune old checkpoints"; "delete" appears only in a code comment. Requiring
  # "delete" alone passed by luck at 1000-character chunks and failed a correct paraphrase at 750.
  must_mention: [["prune", "pruning", "delete"]]
  should_refuse: false
  expect_source: data/langchain-persistence.md

- id: thread-id-config
  question: How do I pass a thread_id when invoking a graph?
  must_mention: ["configurable", "thread_id"]
  should_refuse: false
  # add-memory.md builds a graph and passes {"configurable": {"thread_id": "1"}} to it in
  # almost every example, so it answers this as well as persistence.md does. Listing only
  # persistence.md failed a correct answer that showed the configurable key, when
  # nomic-embed-text fetched add-memory.md instead. short-term-memory.md is left out: its
  # examples invoke an agent, not a graph.
  expect_source:
    - data/langchain-persistence.md
    - data/langchain-add-memory.md

# --- Answerable: managing message history ---

- id: trim-messages
  question: How do I keep a conversation from outgrowing the model's context window?
  must_mention: ["trim"]
  should_refuse: false
  expect_source: data/langchain-short-term-memory.md

- id: trim-middleware
  question: Which middleware decorator is used to trim message history in an agent?
  must_mention: ["before_model"]
  should_refuse: false
  expect_source: data/langchain-short-term-memory.md

- id: delete-messages
  question: What class do I use to delete messages from agent state?
  must_mention: ["RemoveMessage"]
  should_refuse: false
  expect_source: data/langchain-short-term-memory.md

- id: summarize-messages
  question: What is the built-in way to summarize message history instead of trimming it?
  must_mention: ["SummarizationMiddleware"]
  should_refuse: false
  expect_source: data/langchain-short-term-memory.md

- id: trim-vs-summarize
  question: What is the downside of trimming or deleting messages compared with summarizing them?
  # The doc says you "may lose information". Any form of the word counts.
  must_mention: [["lose", "lost", "loss"]]
  should_refuse: false
  expect_source: data/langchain-short-term-memory.md

# --- Answerable: long-term memory and stores ---

- id: long-term-memory-store
  question: How do I store information that should persist across different conversation threads?
  # "store" alone was in the question itself, so it passed on any answer that repeated it.
  # These name an actual store or how one is organised, and each appears in both expected files
  # except PostgresStore and BaseStore, which only add-memory.md uses.
  must_mention: [["InMemoryStore", "PostgresStore", "BaseStore", "namespace"]]
  # Fails in every setup, and is kept as written on purpose. It describes the need, while the
  # documents name the solution "long-term memory", so the answer chunk ranks 10th or lower and
  # is never retrieved. Rewording it to match would hide that weakness. See ROADMAP.md.
  should_refuse: false
  # Two files answer this one properly: add-memory.md explains stores at length, and
  # persistence.md covers the same ground in its checkpointer-vs-store table. Pinning it to a
  # single file failed a correct, well-cited answer. Either source counts.
  expect_source:
    - data/langchain-add-memory.md
    - data/langchain-persistence.md

- id: store-semantic-search
  question: How do I enable semantic search in a LangGraph memory store?
  must_mention: ["embed"]
  should_refuse: false
  expect_source: data/langchain-add-memory.md

